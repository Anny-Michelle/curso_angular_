<section class="tablero" aria-labelledby="titulo-tablero">
  <div class="encabezado-tablero">
    <div>
      <p class="etiqueta-seccion">RUTA DE APRENDIZAJE</p>
      <h2 id="titulo-tablero">Mi tablero de progreso</h2>
      <p class="subtitulo">Organiza tus siguientes pasos y mantén el ritmo.</p>
    </div>
  </div>

  @if (seleccionada(); as elegida) {
    <p class="seleccionada" role="status">
      Seleccionada: <strong>{{ elegida.titulo }}</strong> · creada el {{ elegida.creadaEn }}
    </p>
  }

  <app-panel-seccion titulo="Resumen">
    <app-resumen-actividades
      [total]="total()"
      [pendientes]="pendientes()"
      [enProgreso]="enProgreso()"
      [completadas]="completadas()"
      [porcentaje]="porcentaje()" />
  </app-panel-seccion>

  <app-panel-seccion titulo="Buscar y filtrar">
    <app-filtros-actividades
      [(termino)]="termino"
      [(estado)]="filtroEstado"
      [(prioridad)]="filtroPrioridad" />
    <p class="anuncio" role="status" aria-live="polite">
      {{ mostradas() }} de {{ total() }} actividades visibles
      <span class="solo-lector">{{ ultimoAviso() }}</span>
    </p>
  </app-panel-seccion>

  <app-panel-seccion titulo="Actividades">
    <button acciones class="boton-secundario" type="button" (click)="restablecer()">
      Vaciar el tablero
    </button>
    <app-lista-actividades
      [actividades]="visibles()"
      [seleccionadaId]="seleccionadaId()"
      [mensajeVacio]="mensajeVacio()"
      [hayFiltros]="hayFiltros()"
      (seleccionCambiada)="seleccionar($event)"
      (destacadoCambiado)="alternarDestacada($event)"
      (avanceSolicitado)="avanzarEstado($event)"
      (eliminacionSolicitada)="eliminar($event)"
      (limpiezaSolicitada)="limpiarFiltros()" />
  </app-panel-seccion>
</section>
