<article
  class="tarjeta"
  [class.destacada]="actividad().destacada"
  [class.seleccionada]="seleccionada()"
>
  <div class="cabecera-tarjeta">
    <h4>{{ actividad().titulo }}</h4>
    @if (actividad().destacada) {
      <span class="insignia-destacada">Destacada</span>
    }
  </div>

  <div class="meta-tarjeta">
    <p class="prioridad prioridad-{{ actividad().prioridad }}">
      Prioridad {{ actividad().prioridad }}
    </p>
    <p class="estado estado-{{ actividad().estado }}">{{ etiquetaEstado() }}</p>
  </div>

  <p class="fecha">Registrada el {{ actividad().creadaEn }}</p>

  <div class="acciones">
    <button
      class="boton-principal"
      type="button"
      [attr.aria-label]="etiquetaSeleccion()"
      [attr.aria-pressed]="seleccionada()"
      (click)="seleccionCambiada.emit(actividad().id)"
    >
      {{ seleccionada() ? 'Quitar selección' : 'Seleccionar' }}
    </button>
    <button
      class="boton-secundario"
      type="button"
      [attr.aria-label]="etiquetaDestacado()"
      [attr.aria-pressed]="actividad().destacada"
      (click)="destacadoCambiado.emit(actividad().id)"
    >
      {{ actividad().destacada ? 'Quitar destacado' : 'Destacar' }}
    </button>
    <button
      class="boton-principal"
      type="button"
      [attr.aria-label]="etiquetaAvance()"
      [disabled]="actividad().estado === 'completada'"
      (click)="avanceSolicitado.emit(actividad().id)"
    >
      Avanzar estado
    </button>
    <button
      class="boton-peligro"
      type="button"
      [attr.aria-label]="etiquetaEliminar()"
      (click)="eliminacionSolicitada.emit(actividad().id)"
    >
      Eliminar
    </button>
  </div>
</article>
