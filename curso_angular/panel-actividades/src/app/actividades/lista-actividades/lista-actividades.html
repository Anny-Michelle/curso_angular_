<ul #lista class="lista" tabindex="-1" aria-label="Actividades">
  @for (actividad of actividades(); track actividad.id) {
    <li>
      <app-tarjeta-actividad
        [actividad]="actividad"
        [seleccionada]="actividad.id === seleccionadaId()"
        (seleccionCambiada)="seleccionCambiada.emit($event)"
        (destacadoCambiado)="destacadoCambiado.emit($event)"
        (avanceSolicitado)="avanceSolicitado.emit($event)"
        (eliminacionSolicitada)="solicitarEliminacion($event)" />
      <a class="enlace-detalle" [routerLink]="['/actividades', actividad.id]">
        Ver detalle de {{ actividad.titulo }}
      </a>
    </li>
  } @empty {
    <li class="vacio">
      <p>{{ mensajeVacio() }}</p>
      @if (hayFiltros()) {
        <button type="button" (click)="limpiezaSolicitada.emit()">Quitar los filtros</button>
      }
    </li>
  }
</ul>
